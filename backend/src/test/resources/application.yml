spring:
  datasource:
    url: jdbc:h2:mem:weatherhub;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

weatherhub:
  seed-rbac: false
  gis:
    enabled: false
  jwt:
    secret: weather-data-hub-test-jwt-secret-key-32b
  ai:
    enabled: true
    api-key: ""
    model: test-model
