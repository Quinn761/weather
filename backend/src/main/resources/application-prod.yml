spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2s

weatherhub:
  seed-rbac: ${SEED_RBAC:true}
  jwt:
    secret: ${JWT_SECRET}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost,http://127.0.0.1}
  gis:
    enabled: ${GIS_ENABLED:true}
    datasource:
      url: ${POSTGIS_URL}
      username: ${POSTGIS_USERNAME}
      password: ${POSTGIS_PASSWORD}
  ai:
    enabled: ${AI_ENABLED:true}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    embedding-model: ${AI_EMBEDDING_MODEL:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:90}
    max-tool-rounds: ${AI_MAX_TOOL_ROUNDS:6}

logging:
  level:
    com.weatherhub: INFO
    org.hibernate.SQL: WARN
    com.weatherhub.user: INFO
    com.weatherhub.rbac: INFO
