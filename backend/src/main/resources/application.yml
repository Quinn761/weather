spring:
  application:
    name: weather-data-hub
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/weatherhub?useUnicode=true&characterEncoding=utf8&characterSetResults=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  mvc:
    async:
      request-timeout: 180000

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

weatherhub:
  seed-rbac: true
  jwt:
    secret: ${JWT_SECRET:weather-data-hub-dev-jwt-secret-key-32b}
    expire-hours: 24
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  gis:
    enabled: ${GIS_ENABLED:true}
    datasource:
      url: ${POSTGIS_URL:jdbc:postgresql://127.0.0.1:5432/weatherhub_gis}
      username: ${POSTGIS_USERNAME:weatherhub}
      password: ${POSTGIS_PASSWORD:weatherhub}
  ai:
    enabled: ${AI_ENABLED:true}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    embedding-model: ${AI_EMBEDDING_MODEL:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:90}
    max-tool-rounds: ${AI_MAX_TOOL_ROUNDS:6}
    python-agent-url: ${PYTHON_AGENT_URL:}
  camera:
    capture:
      enabled: ${CAMERA_CAPTURE_ENABLED:true}
      stream-url: ${CAMERA_CAPTURE_STREAM_URL:https://gcalic.v.myalicdn.com/gc/hswlf_1/index.m3u8?contentid=2820180516001}
      storage-path: ${CAMERA_CAPTURE_STORAGE_PATH:data/camera-snapshots}
      ffmpeg-command: ${FFMPEG_COMMAND:ffmpeg}
      timeout-seconds: ${CAMERA_CAPTURE_TIMEOUT_SECONDS:45}
  qweather:
    api-key: ${QWEATHER_API_KEY:}
    api-host: ${QWEATHER_API_HOST:https://devapi.qweather.com}
    cache-minutes: ${QWEATHER_CACHE_MINUTES:60}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.weatherhub: INFO
    org.hibernate.SQL: WARN
    com.weatherhub.user: DEBUG
    com.weatherhub.rbac: DEBUG
