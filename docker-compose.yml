services:
  mysql:
    image: mysql:8.4.9
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: weatherhub
    volumes:
      - weatherhub-mysql:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  postgis:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: weatherhub_gis
      POSTGRES_USER: weatherhub
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD:?请在 .env 中设置 POSTGIS_PASSWORD}
    ports:
      - "${POSTGIS_PORT:-5432}:5432"
    volumes:
      - weatherhub-postgis:/var/lib/postgresql/data
      - ./deploy/postgis/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weatherhub -d weatherhub_gis"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  python-agent:
    build:
      context: ./python-agent
      dockerfile: Dockerfile
      args:
        INSTALL_SAM2: ${INSTALL_SAM2:-false}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
      # The bundled tiny checkpoint is mounted at /models by default.
      # Do not override the image default with an empty value when .env omits it.
      SAM2_CHECKPOINT: ${SAM2_CHECKPOINT:-/models/sam2.1_hiera_tiny.pt}
      SAM2_CONFIG: ${SAM2_CONFIG:-configs/sam2.1/sam2.1_hiera_t.yaml}
      SAM2_DEVICE: ${SAM2_DEVICE:-cpu}
    volumes:
      - ./python-agent/checkpoints:/models:ro
    ports:
      - "${PYTHON_AGENT_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-agent:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_URL: jdbc:mysql://mysql:3306/weatherhub?useUnicode=true&characterEncoding=utf8&characterSetResults=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      POSTGIS_URL: jdbc:postgresql://postgis:5432/weatherhub_gis
      POSTGIS_USERNAME: weatherhub
      POSTGIS_PASSWORD: ${POSTGIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      SEED_RBAC: ${SEED_RBAC:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      JEV_ENABLED: ${JEV_ENABLED:-false}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_BASE_URL: ${JEV_BASE_URL:-https://api.typesafe.ai}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_TIMEOUT_SECONDS: ${JEV_TIMEOUT_SECONDS:-8}
      JEV_MINIMUM_CONFIDENCE: ${JEV_MINIMUM_CONFIDENCE:-0.75}
      PYTHON_AGENT_URL: http://python-agent:8000
      SAM2_SERVICE_URL: ${SAM2_SERVICE_URL:-http://python-agent:8000}
      CAMERA_CAPTURE_ENABLED: ${CAMERA_CAPTURE_ENABLED:-false}
      CAMERA_CAPTURE_STREAM_URL: ${CAMERA_CAPTURE_STREAM_URL:-}
      CAMERA_CAPTURE_STORAGE_PATH: /data/camera-snapshots
      FFMPEG_COMMAND: ffmpeg
      QWEATHER_API_KEY: ${QWEATHER_API_KEY:-}
      QWEATHER_API_HOST: ${QWEATHER_API_HOST:-https://devapi.qweather.com}
    volumes:
      - weatherhub-camera-snapshots:/data/camera-snapshots
    expose:
      - "8080"
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # The Nginx entrypoint writes this value to /env.js at container start.
      # Keep the API key outside the image so replacing it only needs a restart.
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  weatherhub-mysql:
  weatherhub-postgis:
  weatherhub-camera-snapshots:
