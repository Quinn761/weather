apiVersion: v1
kind: Service
metadata:
  name: python-agent
  namespace: weather
spec:
  selector:
    app: python-agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-agent
  namespace: weather
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-agent
  template:
    metadata:
      labels:
        app: python-agent
    spec:
      containers:
        - name: python-agent
          image: weather_python_agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: TZ
            - name: AI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: AI_BASE_URL
            - name: AI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: AI_MODEL
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weather-secret
                  key: AI_API_KEY
                  optional: true
            - name: SAM2_CHECKPOINT
              value: /models/sam2.1_hiera_tiny.pt
            - name: SAM2_CONFIG
              value: configs/sam2.1/sam2.1_hiera_t.yaml
            - name: SAM2_DEVICE
              value: cpu
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
