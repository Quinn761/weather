apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: weather
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: https
      port: 443
      targetPort: 443
      nodePort: 30000
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: weather
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: weather_frontend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ROBOFLOW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weather-secret
                  key: ROBOFLOW_API_KEY
                  optional: true
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          volumeMounts:
            - name: frontend-tls
              mountPath: /etc/nginx/certs
              readOnly: true
      volumes:
        - name: frontend-tls
          secret:
            secretName: weatherhub-ip-tls
            items:
              - key: weatherhub-ip.crt
                path: weatherhub-ip.crt
              - key: weatherhub-ip.key
                path: weatherhub-ip.key
