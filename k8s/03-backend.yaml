apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: weather
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: weather
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: weather_backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: TZ
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: MYSQL_URL
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: MYSQL_URL
            - name: MYSQL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: MYSQL_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weather-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: weather-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRE_HOURS
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: JWT_EXPIRE_HOURS
            - name: SEED_RBAC
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: SEED_RBAC
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: CORS_ORIGINS
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
