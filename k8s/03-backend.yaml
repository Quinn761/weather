apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: weather
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: weather
spec:
  replicas: 1
  # Small node also runs MySQL/PostGIS/Redis/SAM; avoid surging a second JVM.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: weather_backend:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 768Mi
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError
            - name: SAM2_SERVICE_URL
              value: http://python-agent:8000
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: TZ
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: MYSQL_URL
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: MYSQL_URL
            - name: MYSQL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: MYSQL_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weather-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: weather-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRE_HOURS
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: JWT_EXPIRE_HOURS
            - name: SEED_RBAC
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: SEED_RBAC
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: CORS_ORIGINS
            - name: POSTGIS_URL
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: POSTGIS_URL
            - name: POSTGIS_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: POSTGIS_USERNAME
            - name: POSTGIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weather-secret
                  key: POSTGIS_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: REDIS_PORT
            - name: AI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: AI_BASE_URL
            - name: AI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: AI_MODEL
            - name: JEV_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: JEV_ENABLED
            - name: JEV_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: JEV_BASE_URL
            - name: JEV_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: JEV_TIMEOUT_SECONDS
            - name: JEV_MINIMUM_CONFIDENCE
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: JEV_MINIMUM_CONFIDENCE
            - name: PYTHON_AGENT_URL
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: PYTHON_AGENT_URL
            - name: CAMERA_CAPTURE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: CAMERA_CAPTURE_ENABLED
            - name: CAMERA_CAPTURE_STREAM_URL
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: CAMERA_CAPTURE_STREAM_URL
            - name: CAMERA_CAPTURE_STORAGE_PATH
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: CAMERA_CAPTURE_STORAGE_PATH
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weather-secret
                  key: AI_API_KEY
                  optional: true
            - name: JEV_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weather-secret
                  key: JEV_API_KEY
                  optional: true
            - name: QWEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weather-secret
                  key: QWEATHER_API_KEY
                  optional: true
            - name: QWEATHER_API_HOST
              valueFrom:
                secretKeyRef:
                  name: weather-secret
                  key: QWEATHER_API_HOST
                  optional: true
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: camera-snapshots
              mountPath: /data/camera-snapshots
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
      volumes:
        - name: camera-snapshots
          persistentVolumeClaim:
            claimName: camera-snapshots
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: camera-snapshots
  namespace: weather
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
