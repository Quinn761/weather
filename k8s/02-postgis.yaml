apiVersion: v1
kind: Service
metadata:
  name: postgis
  namespace: weather
spec:
  selector:
    app: postgis
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgis
  namespace: weather
spec:
  serviceName: postgis
  replicas: 1
  selector:
    matchLabels:
      app: postgis
  template:
    metadata:
      labels:
        app: postgis
    spec:
      containers:
        - name: postgis
          image: postgis/postgis:16-3.5
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: TZ
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: POSTGIS_DATABASE
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: weather-config
                  key: POSTGIS_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weather-secret
                  key: POSTGIS_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          volumeMounts:
            - name: postgis-data
              mountPath: /var/lib/postgresql/data
            - name: postgis-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: postgis-init
          configMap:
            name: postgis-init
  volumeClaimTemplates:
    - metadata:
        name: postgis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
