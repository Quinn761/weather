server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /env.js {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection '';
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 180s;
    }

    location /uav-tiles/ {
        proxy_pass http://60.205.211.104:8888/uav/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    location /rf-api/ {
        proxy_pass https://serverless.roboflow.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host serverless.roboflow.com;
        proxy_set_header Authorization $http_authorization;
        # Expose only non-sensitive upstream diagnostics to the same-origin UI.
        # CF-Ray lets Roboflow Support locate the exact WAF decision.
        add_header X-Roboflow-CF-Ray $upstream_http_cf_ray always;
        add_header X-Roboflow-Upstream-Status $upstream_status always;
        proxy_read_timeout 180s;
        client_max_body_size 20m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
