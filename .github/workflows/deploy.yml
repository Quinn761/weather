# Required GitHub secrets:
#   DEPLOY_HOST     e.g. 60.205.211.104
#   DEPLOY_USER     e.g. root
#   DEPLOY_SSH_KEY  private key whose public half is in the server authorized_keys
# Optional:
#   AI_API_KEY
#   ROBOFLOW_API_KEY  same value as local VITE_ROBOFLOW_API_KEY; used by GIS AI 圈地
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - k8s/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_USER }}" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "缺少 Secrets：DEPLOY_HOST、DEPLOY_USER、DEPLOY_SSH_KEY"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: |
            weather_backend:${{ github.sha }}
            weather_backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          build-args: |
            VITE_ROBOFLOW_API_KEY=${{ secrets.ROBOFLOW_API_KEY }}
          tags: |
            weather_frontend:${{ github.sha }}
            weather_frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Save images and manifests
        run: |
          docker pull redis:7.4-alpine
          docker save \
            "weather_backend:${IMAGE_TAG}" \
            weather_backend:latest \
            "weather_frontend:${IMAGE_TAG}" \
            weather_frontend:latest \
            redis:7.4-alpine \
            | gzip -1 > weather-images.tar.gz
          tar czf weather-k8s.tar.gz k8s
          ls -lh weather-images.tar.gz weather-k8s.tar.gz

      - name: Copy artifacts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: weather-images.tar.gz,weather-k8s.tar.gz
          target: /tmp
          timeout: 15m

      - name: Import images and rollout
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ github.sha }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
          SAM2_SERVICE_URL: ${{ vars.SAM2_SERVICE_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,AI_API_KEY,ROBOFLOW_API_KEY,SAM2_SERVICE_URL
          command_timeout: 20m
          script: |
            set -euo pipefail
            IMAGE_TAG="${IMAGE_TAG:-${{ github.sha }}}"
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            export PATH="/usr/local/bin:/usr/bin:$PATH"

            img="$(find /tmp -name weather-images.tar.gz -type f | head -n 1)"
            k8s="$(find /tmp -name weather-k8s.tar.gz -type f | head -n 1)"
            if [ -z "$img" ] || [ -z "$k8s" ]; then
              echo "找不到上传的制品"
              ls -la /tmp
              exit 1
            fi

            gzip -dc "$img" | k3s ctr images import -
            mkdir -p /tmp/weather-k8s-unpack
            tar xzf "$k8s" -C /tmp/weather-k8s-unpack
            K8SDIR="/tmp/weather-k8s-unpack/k8s"

            kubectl apply -f "$K8SDIR/01-config.yaml"
            kubectl apply -f "$K8SDIR/02-redis.yaml"
            kubectl apply -f "$K8SDIR/03-backend.yaml"
            kubectl apply -f "$K8SDIR/04-frontend.yaml"
            kubectl -n weather rollout status deploy/redis --timeout=120s

            AI_API_KEY="${AI_API_KEY:-}"
            ROBOFLOW_API_KEY="${ROBOFLOW_API_KEY:-}"
            if [ -z "$AI_API_KEY" ] && [ -f /root/.weather-ai-key ]; then
              AI_API_KEY="$(tr -d '\r\n' < /root/.weather-ai-key)"
            fi
            if [ -z "$ROBOFLOW_API_KEY" ] && [ -f /root/.weather-roboflow-key ]; then
              ROBOFLOW_API_KEY="$(tr -d '\r\n' < /root/.weather-roboflow-key)"
            fi
            if [ -n "$AI_API_KEY" ]; then
              printf '%s' "$AI_API_KEY" > /root/.weather-ai-key
              chmod 600 /root/.weather-ai-key
            fi
            if [ -n "$ROBOFLOW_API_KEY" ]; then
              printf '%s' "$ROBOFLOW_API_KEY" > /root/.weather-roboflow-key
              chmod 600 /root/.weather-roboflow-key
            fi
            python3 -c "import json; from pathlib import Path; data={'stringData':{}}; ai=Path('/root/.weather-ai-key'); rf=Path('/root/.weather-roboflow-key'); k=ai.read_text().strip() if ai.exists() else ''; data['stringData'].update({'AI_API_KEY':k} if k else {}); k=rf.read_text().strip() if rf.exists() else ''; data['stringData'].update({'ROBOFLOW_API_KEY':k} if k else {}); Path('/tmp/secret-patch.json').write_text(json.dumps(data)) if data['stringData'] else None"
            if [ -f /tmp/secret-patch.json ]; then
              kubectl -n weather patch secret weather-secret --type merge --patch-file /tmp/secret-patch.json
              rm -f /tmp/secret-patch.json
              echo "已写入密钥：AI_API_KEY=${#AI_API_KEY} 字符，ROBOFLOW_API_KEY=${#ROBOFLOW_API_KEY} 字符"
            else
              echo "未配置 AI_API_KEY / ROBOFLOW_API_KEY"
            fi

            # SAM is deployed independently because its model image is large.
            # A frontend/backend release must preserve an existing inference service.
            kubectl -n weather set env deploy/backend \
              "SAM2_SERVICE_URL=${SAM2_SERVICE_URL:-http://python-agent:8000}"
            if [ -z "${SAM2_SERVICE_URL:-}" ] && ! kubectl -n weather get service python-agent >/dev/null 2>&1; then
              echo "SAM 2.1 尚未部署：需要独立部署 python-agent，或设置仓库变量 SAM2_SERVICE_URL。"
            fi

            kubectl -n weather set image deploy/backend "backend=weather_backend:${IMAGE_TAG}"
            kubectl -n weather set image deploy/frontend "frontend=weather_frontend:${IMAGE_TAG}"

            dump() {
              echo "===== pods ====="
              kubectl -n weather get pods -o wide || true
              echo "===== backend ====="
              kubectl -n weather describe deploy/backend | tail -60 || true
              kubectl -n weather logs deploy/backend --tail=120 || true
              echo "===== redis ====="
              kubectl -n weather logs deploy/redis --tail=40 || true
              echo "===== disk ====="
              df -h || true
              exit 1
            }

            kubectl -n weather rollout status deploy/backend --timeout=360s || dump
            kubectl -n weather rollout status deploy/frontend --timeout=120s || dump
            curl -fsS "http://127.0.0.1:30080/api/health" || dump
            echo
            kubectl -n weather get pods
            rm -f "$img" "$k8s"
            rm -rf /tmp/weather-k8s-unpack
