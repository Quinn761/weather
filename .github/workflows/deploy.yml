# Required GitHub secrets:
#   DEPLOY_HOST     e.g. 60.205.211.104
#   DEPLOY_USER     e.g. root
#   DEPLOY_SSH_KEY  private key whose public half is in the server authorized_keys
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - python-agent/**
      - k8s/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_USER }}" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "缺少 Secrets：DEPLOY_HOST、DEPLOY_USER、DEPLOY_SSH_KEY"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: |
            weather_backend:${{ github.sha }}
            weather_backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: |
            weather_frontend:${{ github.sha }}
            weather_frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build python-agent image with SAM 2.1
        uses: docker/build-push-action@v6
        with:
          context: ./python-agent
          load: true
          build-args: |
            INSTALL_SAM2=true
            DOWNLOAD_SAM2_CHECKPOINT=true
          tags: |
            weather_python_agent:${{ github.sha }}
            weather_python_agent:latest
          cache-from: type=gha,scope=python-agent
          cache-to: type=gha,mode=max,scope=python-agent

      - name: Save images and manifests
        run: |
          docker pull redis:7.4-alpine
          docker save \
            "weather_backend:${IMAGE_TAG}" \
            weather_backend:latest \
            "weather_frontend:${IMAGE_TAG}" \
            weather_frontend:latest \
            "weather_python_agent:${IMAGE_TAG}" \
            weather_python_agent:latest \
            redis:7.4-alpine \
            | gzip -1 > weather-images.tar.gz
          tar czf weather-k8s.tar.gz k8s
          ls -lh weather-images.tar.gz weather-k8s.tar.gz

      - name: Copy artifacts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: weather-images.tar.gz,weather-k8s.tar.gz
          target: /tmp
          timeout: 25m

      - name: Import images and rollout
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ github.sha }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,AI_API_KEY
          command_timeout: 25m
          script: |
            set -euo pipefail
            IMAGE_TAG="${IMAGE_TAG:-${{ github.sha }}}"
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            export PATH="/usr/local/bin:/usr/bin:$PATH"

            img="$(find /tmp -name weather-images.tar.gz -type f | head -n 1)"
            k8s="$(find /tmp -name weather-k8s.tar.gz -type f | head -n 1)"
            if [ -z "$img" ] || [ -z "$k8s" ]; then
              echo "找不到上传的制品"
              ls -la /tmp
              exit 1
            fi

            gzip -dc "$img" | k3s ctr images import -
            mkdir -p /tmp/weather-k8s-unpack
            tar xzf "$k8s" -C /tmp/weather-k8s-unpack
            K8SDIR="/tmp/weather-k8s-unpack/k8s"

            kubectl apply -f "$K8SDIR/01-config.yaml"
            kubectl apply -f "$K8SDIR/02-redis.yaml"
            kubectl apply -f "$K8SDIR/05-python-agent.yaml"
            kubectl apply -f "$K8SDIR/03-backend.yaml"
            kubectl apply -f "$K8SDIR/04-frontend.yaml"
            kubectl -n weather rollout status deploy/redis --timeout=120s

            if [ -z "${AI_API_KEY:-}" ] && [ -f /root/.weather-ai-key ]; then
              AI_API_KEY="$(tr -d '\r\n' < /root/.weather-ai-key)"
            fi
            if [ -n "${AI_API_KEY:-}" ]; then
              printf '%s' "$AI_API_KEY" > /root/.weather-ai-key
              chmod 600 /root/.weather-ai-key
              python3 -c 'import json; from pathlib import Path; k=Path("/root/.weather-ai-key").read_text().strip(); Path("/tmp/ai-patch.json").write_text(json.dumps({"stringData":{"AI_API_KEY":k}}))'
              kubectl -n weather patch secret weather-secret --type merge --patch-file /tmp/ai-patch.json
              rm -f /tmp/ai-patch.json
              echo "已写入 AI_API_KEY（${#AI_API_KEY} 字符）"
            else
              echo "未配置 AI_API_KEY，质检官将走本地交卷"
            fi

            kubectl -n weather set image deploy/python-agent "python-agent=weather_python_agent:${IMAGE_TAG}"
            kubectl -n weather set image deploy/backend "backend=weather_backend:${IMAGE_TAG}"
            kubectl -n weather set image deploy/frontend "frontend=weather_frontend:${IMAGE_TAG}"

            dump() {
              echo "===== pods ====="
              kubectl -n weather get pods -o wide || true
              echo "===== python-agent ====="
              kubectl -n weather describe deploy/python-agent | tail -60 || true
              kubectl -n weather logs deploy/python-agent --tail=120 || true
              echo "===== backend ====="
              kubectl -n weather describe deploy/backend | tail -60 || true
              kubectl -n weather logs deploy/backend --tail=120 || true
              echo "===== redis ====="
              kubectl -n weather logs deploy/redis --tail=40 || true
              exit 1
            }

            kubectl -n weather rollout status deploy/python-agent --timeout=240s || dump
            kubectl -n weather exec deploy/python-agent -- python -c "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)); assert d.get('status')=='UP' and d.get('sam2Configured') is True, d" || dump
            kubectl -n weather rollout status deploy/backend --timeout=360s || dump
            kubectl -n weather rollout status deploy/frontend --timeout=120s || dump
            curl -fsS "http://127.0.0.1:30080/api/health" || dump
            echo
            kubectl -n weather get pods
            rm -f "$img" "$k8s"
            rm -rf /tmp/weather-k8s-unpack
