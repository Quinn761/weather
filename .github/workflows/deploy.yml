# Required GitHub secrets:
#   DEPLOY_HOST     e.g. 60.205.211.104
#   DEPLOY_USER     e.g. root
#   DEPLOY_SSH_KEY  private key whose public half is in the server authorized_keys
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - k8s/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_USER }}" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "缺少 Secrets：DEPLOY_HOST、DEPLOY_USER、DEPLOY_SSH_KEY"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: |
            weather_backend:${{ github.sha }}
            weather_backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: |
            weather_frontend:${{ github.sha }}
            weather_frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Save images
        run: |
          docker save \
            "weather_backend:${IMAGE_TAG}" \
            weather_backend:latest \
            "weather_frontend:${IMAGE_TAG}" \
            weather_frontend:latest \
            | gzip -1 > weather-images.tar.gz
          ls -lh weather-images.tar.gz

      - name: Copy images to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: weather-images.tar.gz
          target: /tmp
          timeout: 10m

      - name: Import images and rollout
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG
          command_timeout: 15m
          script: |
            set -euo pipefail
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            gzip -dc /tmp/weather-images.tar.gz | k3s ctr images import -
            rm -f /tmp/weather-images.tar.gz
            kubectl -n weather set image deploy/backend "backend=weather_backend:${IMAGE_TAG}"
            kubectl -n weather set image deploy/frontend "frontend=weather_frontend:${IMAGE_TAG}"
            kubectl -n weather rollout status deploy/backend --timeout=180s
            kubectl -n weather rollout status deploy/frontend --timeout=180s
            curl -fsS "http://127.0.0.1:30080/api/health"
            echo
            kubectl -n weather get pods
