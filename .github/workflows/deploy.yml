# Required GitHub secrets:
#   DEPLOY_HOST     e.g. 60.205.211.104
#   DEPLOY_USER     e.g. root
#   DEPLOY_SSH_KEY  private key whose public half is in the server authorized_keys
# Optional:
#   AI_API_KEY
#   ROBOFLOW_API_KEY  same value as local VITE_ROBOFLOW_API_KEY; used by GIS AI 圈地
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - python-agent/app/**
      - k8s/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_USER }}" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "缺少 Secrets：DEPLOY_HOST、DEPLOY_USER、DEPLOY_SSH_KEY"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: |
            weather_backend:${{ github.sha }}
            weather_backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          build-args: |
            VITE_ROBOFLOW_API_KEY=${{ secrets.ROBOFLOW_API_KEY }}
          tags: |
            weather_frontend:${{ github.sha }}
            weather_frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Save images and manifests
        run: |
          # One tag per image (layers are shared); retag :latest on the server after import.
          # pigz is gzip-compatible, so the server does not need extra packages.
          sudo apt-get update -qq && sudo apt-get install -y pigz
          docker save \
            "weather_backend:${IMAGE_TAG}" \
            "weather_frontend:${IMAGE_TAG}" \
            | pigz -3 > weather-images.tar.gz
          mkdir -p k8s/python-agent-app
          cp python-agent/app/*.py k8s/python-agent-app/
          tar czf weather-k8s.tar.gz k8s
          ls -lh weather-images.tar.gz weather-k8s.tar.gz

      - name: Copy artifacts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: weather-images.tar.gz,weather-k8s.tar.gz
          target: /tmp/weather-deploy/${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 25m

      - name: Import images and rollout
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ github.sha }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
          SAM2_SERVICE_URL: ${{ vars.SAM2_SERVICE_URL }}
          DEPLOY_DIR: /tmp/weather-deploy/${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,AI_API_KEY,ROBOFLOW_API_KEY,SAM2_SERVICE_URL,DEPLOY_DIR
          command_timeout: 25m
          script: |
            set -euo pipefail
            IMAGE_TAG="${IMAGE_TAG:-${{ github.sha }}}"
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            export PATH="/usr/local/bin:/usr/bin:$PATH"
            export DEPLOY_DIR
            umask 077
            # Bound client startup/discovery as well as individual API requests.
            KUBECTL_BIN="$(command -v kubectl)"
            kubectl() {
              timeout --kill-after=5s 150s "$KUBECTL_BIN" --request-timeout=20s "$@"
            }

            echo "== host =="
            df -h / || true
            free -h || true
            # Do not use pkill -f here: drone-ssh includes this entire script in
            # the parent shell command line, so it can terminate its own deploy.
            [[ "$DEPLOY_DIR" =~ ^/tmp/weather-deploy/[0-9]+-[0-9]+$ ]] || {
              echo "Invalid deployment artifact directory"; exit 1;
            }
            exec 9>/var/lock/weather-deploy.lock
            echo "== acquire deployment lock =="
            flock -w 120 9 || { echo "Another deployment is still running"; exit 1; }
            echo "== Kubernetes API readiness =="
            kubectl get --raw=/readyz || {
              echo "Kubernetes API is unavailable; aborting before changing workloads"
              free -h || true
              exit 1
            }
            PYTHON_REPLICAS=""
            restore_python() {
              local status=$?
              trap - EXIT
              if [ -n "$PYTHON_REPLICAS" ]; then
                kubectl --request-timeout=20s -n weather scale deploy/python-agent --replicas="$PYTHON_REPLICAS" || {
                  echo "Failed to restore python-agent replicas=$PYTHON_REPLICAS"
                  status=1
                }
                if [ "$status" -eq 0 ] && [ "$PYTHON_REPLICAS" -gt 0 ]; then
                  kubectl -n weather rollout status deploy/python-agent --timeout=120s || status=1
                fi
              fi
              exit "$status"
            }
            trap restore_python EXIT
            trap 'exit 143' TERM
            trap 'exit 130' INT

            # Tiny node (~3.4Gi): pause SAM during import/rollout so JVM can start.
            echo "== read python-agent replicas =="
            PYTHON_REPLICAS="$(kubectl -n weather get deploy python-agent --ignore-not-found -o jsonpath='{.spec.replicas}')"
            if [ -n "$PYTHON_REPLICAS" ]; then
              echo "== scale python-agent to 0 for free RAM =="
              kubectl -n weather scale deploy/python-agent --replicas=0
              kubectl -n weather wait --for=delete pod -l app=python-agent --timeout=90s
              free -h || true
            fi

            img="$DEPLOY_DIR/weather-images.tar.gz"
            k8s="$DEPLOY_DIR/weather-k8s.tar.gz"
            if [ ! -s "$img" ] || [ ! -s "$k8s" ]; then
              echo "找不到上传的制品"
              ls -la "$DEPLOY_DIR"
              exit 1
            fi

            echo "== artifacts =="
            ls -lh "$img" "$k8s"

            echo "== import start $(date -Is) =="
            # Fail fast with diagnostics instead of hanging the whole SSH step.
            if ! timeout --kill-after=30s 8m bash -o pipefail -c 'gzip -dc "$1" | k3s ctr images import -' bash "$img"; then
              echo "镜像导入失败或超时"
              df -h / || true
              free -h || true
              exit 1
            fi
            echo "== import done $(date -Is) =="
            k3s ctr images tag "docker.io/library/weather_backend:${IMAGE_TAG}" weather_backend:latest || \
              k3s ctr images tag "weather_backend:${IMAGE_TAG}" weather_backend:latest || true
            k3s ctr images tag "docker.io/library/weather_frontend:${IMAGE_TAG}" weather_frontend:latest || \
              k3s ctr images tag "weather_frontend:${IMAGE_TAG}" weather_frontend:latest || true
            rm -f "$img"

            mkdir -p "$DEPLOY_DIR/manifests"
            tar xzf "$k8s" -C "$DEPLOY_DIR/manifests"
            K8SDIR="$DEPLOY_DIR/manifests/k8s"

            SAM2_URL="${SAM2_SERVICE_URL:-http://python-agent:8000}"
            # Bake image tags + SAM URL into manifests so apply triggers a single rollout.
            sed -i "s|image: weather_backend:.*|image: weather_backend:${IMAGE_TAG}|" "$K8SDIR/03-backend.yaml"
            sed -i "s|value: http://python-agent:8000|value: ${SAM2_URL}|" "$K8SDIR/03-backend.yaml"
            sed -i "s|image: weather_frontend:.*|image: weather_frontend:${IMAGE_TAG}|" "$K8SDIR/04-frontend.yaml"

            echo "== apply manifests =="
            kubectl apply -f "$K8SDIR/01-config.yaml"
            kubectl apply -f "$K8SDIR/02-redis.yaml"
            kubectl -n weather rollout status deploy/redis --timeout=120s

            AI_API_KEY="${AI_API_KEY:-}"
            ROBOFLOW_API_KEY="${ROBOFLOW_API_KEY:-}"
            if [ -z "$AI_API_KEY" ] && [ -f /root/.weather-ai-key ]; then
              AI_API_KEY="$(tr -d '\r\n' < /root/.weather-ai-key)"
            fi
            if [ -z "$ROBOFLOW_API_KEY" ] && [ -f /root/.weather-roboflow-key ]; then
              ROBOFLOW_API_KEY="$(tr -d '\r\n' < /root/.weather-roboflow-key)"
            fi
            if [ -n "$AI_API_KEY" ]; then
              printf '%s' "$AI_API_KEY" > /root/.weather-ai-key
              chmod 600 /root/.weather-ai-key
            fi
            if [ -n "$ROBOFLOW_API_KEY" ]; then
              printf '%s' "$ROBOFLOW_API_KEY" > /root/.weather-roboflow-key
              chmod 600 /root/.weather-roboflow-key
            fi
            python3 -c "import json,os; from pathlib import Path; data={'stringData':{}}; ai=Path('/root/.weather-ai-key'); rf=Path('/root/.weather-roboflow-key'); k=ai.read_text().strip() if ai.exists() else ''; data['stringData'].update({'AI_API_KEY':k} if k else {}); k=rf.read_text().strip() if rf.exists() else ''; data['stringData'].update({'ROBOFLOW_API_KEY':k} if k else {}); (Path(os.environ['DEPLOY_DIR'])/'secret-patch.json').write_text(json.dumps(data)) if data['stringData'] else None"
            if [ -f "$DEPLOY_DIR/secret-patch.json" ]; then
              kubectl -n weather patch secret weather-secret --type merge --patch-file "$DEPLOY_DIR/secret-patch.json"
              rm -f "$DEPLOY_DIR/secret-patch.json"
              echo "已写入密钥：AI_API_KEY=${#AI_API_KEY} 字符，ROBOFLOW_API_KEY=${#ROBOFLOW_API_KEY} 字符"
            else
              echo "未配置 AI_API_KEY / ROBOFLOW_API_KEY"
            fi

            if [ -n "$PYTHON_REPLICAS" ]; then
              echo "== publish Python Agent source =="
              # Reapply the canonical Deployment manifest so older clusters that
              # were created before LLM support also receive its Secret env ref.
              # Keep it scaled down until the versioned source mount is patched.
              cp "$K8SDIR/05-python-agent.yaml" "$DEPLOY_DIR/05-python-agent.yaml"
              sed -i 's/^  replicas: 1$/  replicas: 0/' "$DEPLOY_DIR/05-python-agent.yaml"
              kubectl apply -f "$DEPLOY_DIR/05-python-agent.yaml"
              CODE_CONFIG="python-agent-code-${IMAGE_TAG:0:12}"
              kubectl -n weather create configmap "$CODE_CONFIG" --from-file="$K8SDIR/python-agent-app" --dry-run=client -o yaml | kubectl apply -f -
              kubectl -n weather get deploy python-agent -o json | python3 "$K8SDIR/python_code_patch.py" "$CODE_CONFIG" > "$DEPLOY_DIR/python-patch.json"
              kubectl -n weather patch deploy python-agent --type strategic --patch-file "$DEPLOY_DIR/python-patch.json"
              rm -f "$DEPLOY_DIR/python-patch.json"
              # Secret-backed environment variables are read only at Pod creation.
              # Bring the Agent back before deploying the Backend, then assert it
              # actually received the key instead of silently falling back later.
              echo "== restart and verify Python Agent =="
              kubectl -n weather scale deploy/python-agent --replicas="$PYTHON_REPLICAS"
              kubectl -n weather rollout status deploy/python-agent --timeout=180s
              PYTHON_LLM_CONFIGURED="$(kubectl -n weather exec deploy/python-agent -- python -c 'import json, urllib.request; print(json.load(urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5))["llmConfigured"])')"
              if [ "$PYTHON_LLM_CONFIGURED" != "True" ]; then
                echo "Python Agent did not receive AI_API_KEY; aborting deployment"
                exit 1
              fi
              echo "Python Agent LLM configuration verified"
              PYTHON_REPLICAS=""
            fi

            kubectl apply -f "$K8SDIR/03-backend.yaml"
            kubectl apply -f "$K8SDIR/04-frontend.yaml"

            # SAM is deployed independently because its model image is large.
            if [ -z "${SAM2_SERVICE_URL:-}" ] && ! kubectl -n weather get service python-agent >/dev/null 2>&1; then
              echo "SAM 2.1 尚未部署：需要独立部署 python-agent，或设置仓库变量 SAM2_SERVICE_URL。"
            fi

            dump() {
              echo "===== pods ====="
              kubectl -n weather get pods -o wide || true
              echo "===== backend pods ====="
              kubectl -n weather describe pods -l app=backend | tail -120 || true
              echo "===== backend logs ====="
              kubectl -n weather logs -l app=backend --tail=120 --prefix=true || true
              kubectl -n weather logs -l app=backend --tail=120 --previous --prefix=true || true
              echo "===== redis ====="
              kubectl -n weather logs deploy/redis --tail=40 || true
              echo "===== memory ====="
              free -h || true
              echo "===== disk ====="
              df -h || true
              exit 1
            }

            wait_rollout() {
              local deploy="$1"
              local timeout_s="$2"
              # Do not inspect every historical Pod selected by app=${deploy} here.
              # A completed/failed Pod from an older ReplicaSet can coexist briefly
              # with the new revision and must not abort an otherwise healthy rollout.
              # Kubernetes rollout status tracks the Deployment's current revision.
              kubectl -n weather rollout status "deploy/${deploy}" --timeout="${timeout_s}s"
            }

            echo "== rollout backend/frontend =="
            wait_rollout backend 240 || dump
            wait_rollout frontend 120 || dump
            curl --connect-timeout 5 --max-time 20 -fsS "http://127.0.0.1:30080/api/health" || dump
            echo
            kubectl -n weather get pods
            rm -f "$k8s"
            rm -rf "$DEPLOY_DIR/manifests"
