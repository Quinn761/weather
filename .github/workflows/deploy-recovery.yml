name: Deploy recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-recovery.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover abandoned deployment processes
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            export PATH="/usr/local/bin:/usr/bin:$PATH"
            # Match argv arrays and orphan parent IDs, never the full SSH script.
            timeout --kill-after=5s 90s python3 - <<'PY'
            import os, signal
            from pathlib import Path
            for p in Path('/proc').iterdir():
                if not p.name.isdigit():
                    continue
                try:
                    status = dict(line.split(':', 1) for line in (p/'status').read_text().splitlines())
                    if status['PPid'].strip() != '1':
                        continue
                    args = (p/'cmdline').read_bytes().split(b'\0')
                    comm = (p/'comm').read_text().strip()
                    importer = p.name == '844544' and comm == 'ctr' and any(args[i:i+2] == [b'images', b'import'] for i in range(len(args)-1))
                    decompressor = p.name == '844543' and comm == 'gzip' and any(a.startswith(b'/tmp/weather-images') for a in args)
                    old_deploy = p.name == '846500' and comm == 'bash' and (b'/tmp/weather-deploy/34820072164-1' in b' '.join(args) or b'weather-deploy.lock' in b' '.join(args))
                    if importer or decompressor or old_deploy:
                        if old_deploy:
                            for child in (p/'task'/p.name/'children').read_text().split():
                                cp = Path('/proc')/child
                                if (cp/'comm').read_text().strip() == 'kubectl':
                                    print('Terminate abandoned kubectl', child, flush=True)
                                    os.kill(int(child), signal.SIGTERM)
                        print('Terminate abandoned process', p.name, comm, flush=True)
                        os.kill(int(p.name), signal.SIGTERM)
                except (FileNotFoundError, ProcessLookupError, PermissionError):
                    pass
            PY
            # Read the local API without loading the large k3s multicall binary.
            timeout --kill-after=5s 90s python3 - <<'PY'
            import base64, json, os, re, ssl, tempfile, urllib.request
            from pathlib import Path
            cfg = Path('/etc/rancher/k3s/k3s.yaml').read_text()
            with tempfile.TemporaryDirectory(prefix='weather-api-') as tmp:
                files = []
                for field in ['certificate-authority-data', 'client-certificate-data', 'client-key-data']:
                    value = re.search(r'^\s*' + field + r':\s*(\S+)', cfg, re.M).group(1).strip(chr(34)+chr(39))
                    path = Path(tmp)/field
                    path.write_bytes(base64.b64decode(value))
                    path.chmod(0o600)
                    files.append(str(path))
                ctx = ssl.create_default_context(cafile=files[0])
                ctx.load_cert_chain(files[1], files[2])
                for route in ['/readyz', '/apis/apps/v1/namespaces/weather/deployments', '/api/v1/namespaces/weather/pods']:
                    print('== direct API', route, '==', flush=True)
                    try:
                        with urllib.request.urlopen('https://127.0.0.1:6443'+route, context=ctx, timeout=15) as response:
                            data = response.read()
                        if route == '/readyz':
                            print(data.decode(), flush=True)
                        else:
                            for item in json.loads(data).get('items', []):
                                print(json.dumps({'name': item['metadata']['name'], 'uid': item['metadata']['uid'], 'deleting': item['metadata'].get('deletionTimestamp'), 'replicas': item.get('spec',{}).get('replicas'), 'status': item.get('status', {})}), flush=True)
                    except Exception as exc:
                        print(type(exc).__name__, str(exc)[:200], flush=True)
            PY
            check() {
              echo "== $1 $(date -Is) =="
              shift
              timeout --kill-after=3s 30s "$@"
              echo "exit=$?"
            }
            check pressure vmstat 2 5
            check memory free -h
            check api-ready kubectl --request-timeout=15s get --raw=/readyz
            check pods kubectl --request-timeout=15s -n weather get pods -o wide
            check containerd k3s ctr version
            check deploy-lock flock -n /var/lock/weather-deploy.lock true
            # Cgroup paths identify duplicate runtimes without printing command arguments.
            check workload-cgroups bash -c 'for p in /proc/[0-9]*; do read -r name < "$p/comm" 2>/dev/null || continue; case "$name" in java|uvicorn) echo "$p $name"; cat "$p/cgroup";; esac; done'
            echo "== recovery checks complete =="
